name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Base et Redis pour les tests d'intégration du backend (apps/api).
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: lokky
          POSTGRES_PASSWORD: lokky
          POSTGRES_DB: lokky_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lokky -d lokky_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://lokky:lokky@localhost:5432/lokky_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
